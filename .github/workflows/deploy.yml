name: 同步 Strava 並部署 GitHub Pages

on:
  push:
    branches: [main, claude/project-thread-75z3q2]
  schedule:
    - cron: "0 20 * * *" # 每天台灣時間 04:00 自動更新
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 匯入 inbox/ 的新活動
        run: |
          files=$(find inbox -type f ! -name README.md | head -1)
          if [ -n "$files" ]; then
            pip install --quiet fitdecode
            python scripts/import_export.py inbox
            find inbox -type f ! -name README.md -delete
            find inbox -mindepth 1 -type d -empty -delete
            git config user.name "github-actions[bot]"
            git config user.email "41898+github-actions[bot]@users.noreply.github.com"
            git add -A inbox site/data/imported.json
            git commit -m "匯入新活動"
            git push
          else
            echo "inbox 沒有新檔案"
          fi

      - name: 從 Strava 抓取活動
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          PRIVACY_TRIM_M: ${{ vars.PRIVACY_TRIM_M || '200' }}
        run: |
          if [ -z "$STRAVA_REFRESH_TOKEN" ]; then
            echo "::notice::尚未設定 Strava secrets，網站會顯示示範資料。"
          else
            # 抓取失敗（例如 Strava API 權限問題）時不阻擋部署，網站仍會顯示匯入的資料
            python scripts/fetch_strava.py || echo "::warning::Strava API 抓取失敗，這次只部署匯入的資料。請查看上方錯誤訊息。"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
